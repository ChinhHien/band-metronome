<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Band Metronome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<!-- Màn hình chờ: phải chọn bài cũ hoặc tạo bài mới trước khi soạn -->
<div id="gate" hidden>
  <div class="gate-card">
    <h2>Band Metronome</h2>
    <p>Chọn một bài hát đã soạn để tiếp tục, hoặc tạo bài hát mới:</p>
    <div class="gate-list-wrap">
      <ul id="gate-list"></ul>
      <p id="gate-empty" class="muted" hidden>Chưa có bài hát nào — bấm “Tạo bài hát mới” để bắt đầu.</p>
    </div>
    <button id="gate-new">＋ Tạo bài hát mới</button>
  </div>
</div>

<!-- Modal đặt tên bài hát -->
<div id="name-modal" hidden>
  <div class="gate-card">
    <h2 id="name-heading">Tạo bài hát mới</h2>
    <label class="name-field">Tên bài hát
      <input id="name-input" maxlength="120" placeholder="VD: Nhật Ký Tuổi Thơ (Live)">
    </label>
    <p id="name-hint" class="err-hint" hidden>Hãy đặt tên cho bài hát.</p>
    <div class="modal-actions">
      <button id="name-cancel" class="ghost">Huỷ</button>
      <button id="name-ok">Xác nhận</button>
    </div>
  </div>
</div>

<!-- Menu chuột phải trên mục lịch sử -->
<div id="ctx-menu" hidden>
  <button data-act="rename"><svg viewBox="0 0 16 16"><path d="M11.5 2.5l2 2-8 8h-2v-2l8-8z"/></svg>Đổi tên…</button>
  <button data-act="download"><svg viewBox="0 0 16 16"><path d="M8 2.5v7.5m0 0L5 7m3 3l3-3M3.5 12.5h9"/></svg>Tải xuống</button>
  <button data-act="delete"><svg viewBox="0 0 16 16"><path d="M3 4.5h10M6 4.5V3h4v1.5M4.5 4.5l.7 9h5.6l.7-9"/></svg>Xoá</button>
</div>

<div class="layout">

  <!-- Cột lịch sử bài hát (giống lịch sử chat) -->
  <aside id="history-panel">
    <h2>Lịch sử bài hát</h2>
    <button id="hist-new" class="ghost">＋ Tạo bài mới</button>
    <ul id="history-list"></ul>
  </aside>

  <main>
    <header>
      <h1>Band Metronome</h1>
      <span class="song-controls">
        <label class="bpm-control">BPM<input id="base-bpm" type="number" min="20" max="400" aria-label="BPM gốc cho toàn bài" placeholder="120"></label>
        <label class="bpm-control">Nhịp<select id="base-sig" aria-label="Số chỉ nhịp mặc định"></select></label>
        <label class="bpm-control">Xuất<select id="base-srate" aria-label="Chuẩn đầu ra (sample rate)"></select></label>
      </span>
    </header>

    <!-- Thanh phát bản ghi — nằm ngay trên thanh tổng quát -->
    <div id="result" hidden>
      <button id="play-btn" aria-label="Phát / dừng" title="Phát / dừng">▶</button>
      <span id="now-time">0:00 / 0:00</span>
      <audio id="preview" preload="none" style="display:none"></audio>
      <div id="gen-progress" hidden><i id="gen-progress-bar"></i></div>
      <a id="dl" class="button ghost" href="#">Tải xuống</a>
    </div>

    <div class="tl-wrap" id="tl-wrap" aria-label="Tổng quan cấu trúc (bấm để tua)">
      <div id="timeline"></div>
      <div id="tl-progress" hidden title="Vị trí đang phát — bấm vào thanh để tua"></div>
    </div>
    <p id="total" class="muted"></p>

    <ol id="sections"></ol>

    <div class="actions">
      <button id="add" class="ghost">＋ Thêm đoạn</button>
      <button id="tpl" class="ghost" aria-haspopup="true">Mẫu bài ▾</button>
      <button id="export-json" class="ghost">Xuất JSON</button>
      <button id="import-json" class="ghost">Nhập JSON</button>
      <input id="import-file" type="file" accept=".json,application/json" hidden>
      <button id="generate">Tạo metronome</button>
    </div>
    <div id="tpl-menu" hidden></div>

    <p id="status" role="status"></p>
  </main>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
